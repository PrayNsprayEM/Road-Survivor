    ctx.moveTo(-170,30);ctx.lineTo(-150,-5);ctx.lineTo(-87,-48);ctx.lineTo(54,-48);ctx.lineTo(122,-16);ctx.lineTo(164,2);ctx.lineTo(174,28);ctx.lineTo(158,48);ctx.lineTo(-158,48);ctx.closePath();
  }else{
    ctx.moveTo(-170,30);ctx.lineTo(-150,-6);ctx.lineTo(-78,-52);ctx.lineTo(48,-52);ctx.lineTo(118,-18);ctx.lineTo(162,0);ctx.lineTo(174,28);ctx.lineTo(158,48);ctx.lineTo(-158,48);ctx.closePath();
  }
  ctx.fill();ctx.shadowBlur=0;ctx.shadowOffsetY=0;
  ctx.fillStyle='#1b2028';
  if(car.id==='mx5'){
    ctx.beginPath();ctx.moveTo(-74,-28);ctx.lineTo(-45,-49);ctx.lineTo(36,-49);ctx.lineTo(65,-29);ctx.closePath();ctx.fill();
  }else{
    ctx.beginPath();ctx.moveTo(-77,-42);ctx.lineTo(-48,-65);ctx.lineTo(33,-65);ctx.lineTo(70,-43);ctx.closePath();ctx.fill();
  }
  ctx.fillStyle='#111';ctx.fillRect(-150,22,72,10);ctx.fillRect(87,24,60,8);
  ctx.fillStyle='#fff5c8';ctx.fillRect(-150,7,31,9);ctx.fillRect(119,8,28,9);
  ctx.fillStyle='#db2727';ctx.fillRect(129,27,23,7);
  if(car.id==='gti'){ctx.fillStyle='#c51f32';ctx.fillRect(-130,20,110,3);ctx.fillStyle='#111';ctx.fillRect(-23,22,46,5)}
  for(const x of [-112,112]){
    ctx.fillStyle='#080808';ctx.beginPath();ctx.arc(x,48,31,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#777';ctx.beginPath();ctx.arc(x,48,18,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#bbb';ctx.beginPath();ctx.arc(x,48,8,0,Math.PI*2);ctx.fill();
  }
  let shine=ctx.createLinearGradient(-170,-70,170,60);
  shine.addColorStop(0,'rgba(255,255,255,.25)');shine.addColorStop(.5,'rgba(255,255,255,.04)');shine.addColorStop(1,'rgba(255,255,255,0)');
  ctx.fillStyle=shine;ctx.fillRect(-165,-70,330,120);
}
function dealerUI(){
  const car=cars[dealerIndex],isOwned=ownedCars.includes(car.id),isSelected=selectedCar===car.id;

function dealerPurchaseOrSelect(){

function modeBtn(){els.mode.textContent=mode.toUpperCase()}
function controlLayout(){
  const gyro=mode==='gyro';
  els.steerControls.style.display=gyro?'none':'block';
  els.pedalControls.style.display='flex';
  els.pedalControls.style.flexDirection='column';

  els.pedalControls.style.justifyContent='flex-start';
  els.pedalControls.style.alignItems='flex-end';
  els.controls.style.justifyContent='space-between';
}
function songBtn(){els.song.textContent='TRACK '+song}
function settingsUI(){modeBtn();controlLayout();els.music.value=musicVol;els.sfx.value=sfxVol;songBtn()}
function saveSettings(){localStorage.setItem('mode',mode);localStorage.setItem('music',musicVol);localStorage.setItem('sfx',sfxVol);localStorage.setItem('song',song)}
function bestRunFor(d){
  let a=JSON.parse(localStorage.getItem('scores_'+d)||'[]');
  if(!Array.isArray(a))a=[];
  a.sort((x,y)=>(y.s||0)-(x.s||0));
  return a[0]||null
}
function scores(){
  els.scores.innerHTML=D.map(d=>{
    let b=bestRunFor(d);
    return '<div class="card"><b>'+d.toUpperCase()+'</b><br>'+
      (b?'<span style="font-size:22px;font-weight:900">'+b.s.toLocaleString()+' pts</span><br><small>'+b.t.toFixed(1)+'s • '+Math.round(b.d)+'m</small>':'<small>No run yet.</small>')+
      '</div>'
  }).join('')
}
function start(){panels(null);els.hud.classList.remove('hide');controlLayout();t=dist=score=nearMissBonus=spawn=0;traffic=[];powerUps=[];invisibleUntil=0;nosUntil=0;nearMissUntil=0;els.nearMissToast.style.opacity='0';player={x:W/2,y:H*.68,w:30,h:52,s:0};run=true;last=performance.now();requestAnimationFrame(loop)}
function bind(id,k){
  let b=document.getElementById(id);
  const down=e=>{e.preventDefault();keys[k]=1};
  const up=e=>{e.preventDefault();keys[k]=0};
  b.onpointerdown=down;
  b.onpointerup=b.onpointercancel=b.onpointerleave=up;
  b.addEventListener('touchstart',down,{passive:false});
  b.addEventListener('touchend',up,{passive:false});
  b.addEventListener('touchcancel',up,{passive:false});
  b.addEventListener('contextmenu',e=>e.preventDefault());
  b.addEventListener('selectstart',e=>e.preventDefault());
}['left','right','gas','brake'].forEach(k=>bind(k,k));
addEventListener('keydown',e=>{if(e.key==='ArrowLeft')keys.left=1;if(e.key==='ArrowRight')keys.right=1;if(e.key==='ArrowUp')keys.gas=1;if(e.key==='ArrowDown')keys.brake=1});
addEventListener('keyup',e=>{if(e.key==='ArrowLeft')keys.left=0;if(e.key==='ArrowRight')keys.right=0;if(e.key==='ArrowUp')keys.gas=0;if(e.key==='ArrowDown')keys.brake=0});
let tilt=0,gyroPermission='unknown';
function clamp(v){return Math.max(-1,Math.min(1,v))}
function handleOrientation(e){
  const angle=(screen.orientation&&typeof screen.orientation.angle==='number')?screen.orientation.angle:(typeof window.orientation==='number'?window.orientation:0);
  let steer=0;
  if(Math.abs(angle)===90 && e.beta!=null){
    steer=(angle===90?-e.beta:e.beta)/28;
  }else if(e.gamma!=null){
    steer=e.gamma/28;
  }
  tilt=clamp(steer);
}
addEventListener('deviceorientation',handleOrientation);
async function requestGyroPermission(){
  try{
    if(typeof DeviceOrientationEvent==='undefined'){
      alert('Gyro steering is not supported in this browser.');
      return false;
    }
    if(typeof DeviceOrientationEvent.requestPermission==='function'){
      const result=await DeviceOrientationEvent.requestPermission();
      gyroPermission=result;
      if(result!=='granted'){
        alert('Motion access was not allowed. In Safari, allow Motion & Orientation access, then try Gyro again.');
        return false;
      }
    }else{
      gyroPermission='granted';
    }
    return true;
  }catch(err){
    alert('Could not enable gyro steering. Make sure Motion & Orientation access is allowed for Safari.');
    return false;
  }
}
function loop(now){if(!run)return;let dt=Math.min(.035,(now-last)/1000);last=now;update(dt);draw();requestAnimationFrame(loop)}
function update(dt){
const carData=cars.find(c=>c.id===selectedCar)||cars[0];
let throttle=keys.gas?1:0,braking=keys.brake?1:0;
let target=throttle?Math.min(carData.top,108):68;
if(braking)target=0;
if(performance.now()<nosUntil)target=Math.min(carData.top+40,148);

let accel=selectedCar==='mx5'?27:23;
let brakePower=42;
if(player.s<target)player.s=Math.min(target,player.s+accel*dt);
else player.s=Math.max(target,player.s-(braking?brakePower:13)*dt);

let steerInput=mode==='gyro'?tilt:(keys.right-keys.left);
let speedFactor=.35+Math.min(player.s/100,1)*.75;
steerVel+=(steerInput*330*speedFactor-steerVel)*Math.min(1,dt*8);
player.x+=steerVel*dt;
player.x=Math.max(roadX+24,Math.min(roadX+roadW-24,player.x));

roadOffset=(roadOffset+player.s*2.9*dt)%64;
shake=Math.max(0,shake-dt*3);

let active=player.s>=30;
let nowMs=performance.now(),effects=[];
if(invisibleUntil>nowMs)effects.push('INVIS '+((invisibleUntil-nowMs)/1000).toFixed(1)+'s');
if(nosUntil>nowMs)effects.push('NOS '+((nosUntil-nowMs)/1000).toFixed(1)+'s');
els.status.textContent=(active?'':'TIMER PAUSED — SPEED TOO LOW')+(effects.length?((active?'':' • ')+effects.join(' • ')):'');

if(active){
t+=dt;dist+=player.s*.44704*dt;score=Math.floor((Math.floor(t*10+dist)+nearMissBonus)*scoreMult[diff]*collectionMultiplier());spawn-=dt;
let c=cfg[diff];
if(spawn<=0&&traffic.length<c.max){
let lane=Math.floor(Math.random()*3),r=Math.random(),type='car',w=29,h=50;
if(r<c.trailer){type='trailer';w=38;h=105}
else if(r<c.trailer+c.truck){type='truck';w=35;h=66}
else{
let shapes=['car','sedan','hatch','sports'];type=shapes[Math.floor(Math.random()*shapes.length)];
if(type==='sedan'){w=31;h=56}
if(type==='hatch'){w=30;h=45}
if(type==='sports'){w=32;h=46}
}
let laneCenter=roadX+roadW*(lane+.5)/3;
traffic.push({
x:laneCenter,y:-h-18,w,h,type,lane,
s:c.trafficSpeed*(.78+Math.random()*.35),
drift:(Math.random()-.5)*3,
targetX:laneCenter,
laneTimer:1.5+Math.random()*4.5,
prevY:-h-18,
nearMissAwarded:false
});
spawn=c.spawn*(.82+Math.random()*.36)
}
if(Math.random()<c.power){
let type=Math.random()<.5?'invis':'nos';
powerUps.push({x:roadX+30+Math.random()*(roadW-60),y:-35,w:30,h:30,type,s:90+Math.random()*25})
}
}

traffic.forEach(v=>{
v.prevY=v.y;
v.y+=(v.s+player.s*.38)*dt*(.65+player.s/115);
v.laneTimer=(v.laneTimer??2)-dt;

if(v.laneTimer<=0){
  // Random chance to change one lane left or right.
  if(Math.random()<.42){
    let dir=Math.random()<.5?-1:1;
    let nextLane=Math.max(0,Math.min(2,(v.lane??1)+dir));
    if(nextLane!==(v.lane??1)){
      v.lane=nextLane;
      v.targetX=roadX+roadW*(nextLane+.5)/3;
    }
  }
  v.laneTimer=2.2+Math.random()*5.5;
}

if(v.targetX==null)v.targetX=v.x;
v.x+=(v.targetX-v.x)*Math.min(1,dt*1.8);
});
if(active&&performance.now()>=invisibleUntil){
for(let v of traffic){
if(v.nearMissAwarded)continue;
let crossed=v.prevY<player.y&&v.y>=player.y;
if(!crossed)continue;
let xGap=Math.abs(player.x-v.x);
let hitGap=(player.w+v.w)*.46;
let nearGap=(player.w+v.w)*.78;
if(xGap>=hitGap&&xGap<nearGap){
v.nearMissAwarded=true;
nearMissBonus+=100;
score=Math.floor((Math.floor(t*10+dist)+nearMissBonus)*scoreMult[diff]*collectionMultiplier());
nearMissUntil=performance.now()+1000;
els.nearMissToast.textContent='NEAR MISS +100';
els.nearMissToast.style.opacity='1';
}
}
}
if(performance.now()>=nearMissUntil)els.nearMissToast.style.opacity='0';
traffic=traffic.filter(v=>v.y<H+150);
powerUps.forEach(p=>p.y+=(p.s+player.s*.18)*dt);powerUps=powerUps.filter(p=>p.y<H+50);

for(let i=powerUps.length-1;i>=0;i--){
let p=powerUps[i];
if(Math.abs(player.x-p.x)<34&&Math.abs(player.y-p.y)<44){
if(p.type==='invis')invisibleUntil=performance.now()+5000;
if(p.type==='nos')nosUntil=performance.now()+3000;
powerUps.splice(i,1)
}}

if(active&&performance.now()>=invisibleUntil){
for(let v of traffic){
if(Math.abs(player.x-v.x)<(player.w+v.w)*.46&&Math.abs(player.y-v.y)<(player.h+v.h)*.46){shake=.35;return crashGame()}
}}
els.speed.textContent=Math.round(player.s)+' MPH';
els.score.textContent=score.toLocaleString()
}
function car(x,y,w,h,hero=false,type='car'){
X.save();X.translate(x,y);
X.shadowColor='#0009';X.shadowBlur=8;X.shadowOffsetY=6;
let body=hero?(selectedCar==='mx5'?'#e32636':'#d72e32'):
(type==='truck'?'#d18a2e':type==='trailer'?'#d9d9d9':type==='sports'?'#2563eb':type==='hatch'?'#42a85a':type==='sedan'?'#dadada':'#ececec');
X.fillStyle=body;
X.beginPath();X.roundRect(-w/2,-h/2,w,h,Math.min(5,w*.18));X.fill();
X.shadowBlur=0;X.shadowOffsetY=0;
X.fillStyle='#1b2630';X.fillRect(-w*.34,-h*.30,w*.68,h*.18);X.fillRect(-w*.34,h*.08,w*.68,h*.15);
X.fillStyle='#fff9b0';X.fillRect(-w*.39,-h*.47,w*.22,4);X.fillRect(w*.17,-h*.47,w*.22,4);
X.fillStyle='#e22';X.fillRect(-w*.38,h*.42,w*.18,4);X.fillRect(w*.20,h*.42,w*.18,4);
if(type==='trailer'){X.fillStyle='#aaa';X.fillRect(-w*.40,-h*.02,w*.80,h*.38);X.strokeStyle='#888';X.strokeRect(-w*.40,-h*.02,w*.80,h*.38)}
X.restore()
}
function draw(){
X.clearRect(0,0,W,H);X.save();
if(shake>0)X.translate((Math.random()-.5)*7*shake,(Math.random()-.5)*7*shake);

let grass=X.createLinearGradient(0,0,0,H);grass.addColorStop(0,'#477c43');grass.addColorStop(1,'#244923');
X.fillStyle=grass;X.fillRect(0,0,W,H);

X.fillStyle='#777';X.fillRect(roadX-9,0,9,H);X.fillRect(roadX+roadW,0,9,H);
X.fillStyle='#e7e7e7';X.fillRect(roadX-3,0,3,H);X.fillRect(roadX+roadW,0,3,H);

let asphalt=X.createLinearGradient(roadX,0,roadX+roadW,0);
asphalt.addColorStop(0,'#363636');asphalt.addColorStop(.5,'#4c4c4c');asphalt.addColorStop(1,'#363636');
X.fillStyle=asphalt;X.fillRect(roadX,0,roadW,H);

X.fillStyle='#ffffff08';
for(let i=0;i<50;i++){let xx=roadX+((i*97)%Math.max(1,roadW)),yy=(i*131+roadOffset*3)%Math.max(1,H);X.fillRect(xx,yy,1,1)}

X.strokeStyle='#f5f5f5';X.lineWidth=4;X.setLineDash([28,36]);X.lineDashOffset=roadOffset;
for(let i=1;i<3;i++){X.beginPath();X.moveTo(roadX+roadW*i/3,0);X.lineTo(roadX+roadW*i/3,H);X.stroke()}
X.setLineDash([]);

for(let y=-40+(roadOffset%48);y<H+40;y+=48){X.fillStyle='#f7ef9a';X.fillRect(roadX-13,y,5,10);X.fillRect(roadX+roadW+8,y,5,10)}

traffic.forEach(v=>{
X.save();
if(performance.now()<invisibleUntil)X.globalAlpha=.28;
car(v.x,v.y,v.w,v.h,false,v.type);
X.restore();
});
powerUps.forEach(p=>{
X.save();X.shadowColor=p.type==='invis'?'#6ee7ff':'#ffd60a';X.shadowBlur=18;X.beginPath();X.arc(p.x,p.y,15,0,Math.PI*2);
X.fillStyle=p.type==='invis'?'#8eeaff':'#ffd60a';X.fill();X.shadowBlur=0;X.fillStyle='#111';X.font='bold 10px system-ui';X.textAlign='center';X.textBaseline='middle';
X.fillText(p.type==='invis'?'INVIS':'NOS',p.x,p.y);X.restore()
});
X.save();car(player.x,player.y,player.w,player.h,true);X.restore();

if(player.s>85){let g=X.createRadialGradient(W/2,H/2,Math.min(W,H)*.25,W/2,H/2,Math.max(W,H)*.7);g.addColorStop(0,'#0000');g.addColorStop(1,'#0005');X.fillStyle=g;X.fillRect(0,0,W,H)}
X.restore()
}
function crashGame(){
  run=false;
  let reward=Math.floor(score/100)*10;
  cash+=reward;
  localStorage.setItem('cash',cash);

  let k='scores_'+diff,a=JSON.parse(localStorage.getItem(k)||'[]');
  if(!Array.isArray(a))a=[];
  let oldBest=a.sort((x,y)=>(y.s||0)-(x.s||0))[0]||null;
  let best=(!oldBest||score>oldBest.s)?{s:score,t,d:dist}:oldBest;
  localStorage.setItem(k,JSON.stringify([best]));

  els.ft.textContent=t.toFixed(1)+'s';
  els.fd.textContent=Math.round(dist)+' m';
  els.fs.textContent=score.toLocaleString();
  els.earnings.textContent='$'+reward.toLocaleString();
  els.fb.textContent=best.s.toLocaleString();
  cashUI();
  els.hud.classList.add('hide');
  panels('crash')
}
els.dif.onclick=()=>{diff=cyc(diff);localStorage.setItem('diff',diff);dc(els.dif,diff)};
els.play.onclick=start;els.retry.onclick=start;
els.up.onclick=()=>{upgradesUI();panels('upgrades')};
document.querySelectorAll('.upgradeCat').forEach(b=>b.onclick=()=>upgradesUI(b.dataset.cat));
els.upgradeCatBack.onclick=()=>{upgradesUI();els.upgrades.scrollTop=0};
els.ub.onclick=()=>{controlLayout();panels('menu')};
els.dealerBtn.onclick=()=>{dealerIndex=Math.max(0,cars.findIndex(c=>c.id===selectedCar));dealerUI();panels('dealership')};
els.dealerBack.onclick=()=>{cashUI();panels('menu')};
els.dealerPrev.onclick=()=>{dealerIndex=(dealerIndex-1+cars.length)%cars.length;dealerUI()};
els.dealerNext.onclick=()=>{dealerIndex=(dealerIndex+1)%cars.length;dealerUI()};
els.dealerBuy.onclick=dealerPurchaseOrSelect;
els.lb.onclick=()=>{scores();panels('leader')};els.lbback.onclick=()=>panels('menu');els.set.onclick=()=>{settingsUI();panels('settings')};els.sb.onclick=()=>{saveSettings();panels('menu')};els.cm.onclick=()=>panels('menu');els.cl.onclick=()=>{scores();panels('leader')};
els.mode.onclick=async()=>{
  if(mode==='buttons'){
    const ok=await requestGyroPermission();
    if(!ok)return;
    mode='gyro';
  }else{
    mode='buttons';
    tilt=0;
  }
  modeBtn();
  controlLayout();
  saveSettings();
};els.song.onclick=()=>{song=song%3+1;songBtn()};els.music.oninput=()=>musicVol=+els.music.value;els.sfx.oninput=()=>sfxVol=+els.sfx.value;
dc(els.dif,diff);cashUI();dealerUI();panels('menu');
