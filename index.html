<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Road Survivor</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#151515;font-family:system-ui;color:white;touch-action:none}canvas{width:100%;height:100%;display:block;image-rendering:pixelated}.p{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(92%,430px);padding:22px;background:#111e;border:2px solid white;border-radius:14px;text-align:center;box-shadow:0 8px 30px #000}.hide{display:none}button{margin:5px;padding:13px 18px;border:2px solid white;border-radius:10px;background:#292933;color:white;font-weight:800;font-size:17px;min-width:145px}.diff{font-size:21px}.easy{background:#2e9b4b}.medium{background:#c6a51b}.hard{background:#d66b18}.extreme{background:#c93636}.card{background:#202027;border:1px solid #555;border-radius:9px;padding:10px;margin:6px;text-align:left}.price{float:right}.stat{position:absolute;top:10px;background:#000a;padding:7px 10px;border-radius:8px;font-weight:800}.leftstat{left:10px}.rightstat{right:10px}.status{position:absolute;top:52px;left:50%;transform:translateX(-50%);font-weight:900}.controls{position:absolute;bottom:14px;left:0;right:0;display:flex;justify-content:space-between;padding:0 14px}.ctrl{width:74px;height:65px;padding:0;margin:0;font-size:25px;background:#222c}.pedal{width:78px;height:75px;font-size:15px}.brake{background:#a32f2fcc}.gas{background:#309346cc}
</style></head><body><canvas id="c"></canvas><div id="ui">
<div id="menu" class="p"><h1>ROAD SURVIVOR</h1><p>Dodge traffic. Survive as long as you can.</p><p>Cash: <b id="cash"></b></p><button id="play">PLAY</button><br><button id="up">UPGRADES</button><button id="lb">LEADERBOARD</button><br><button id="set">SETTINGS</button><p>Difficulty</p><button id="dif" class="diff">EASY</button></div>
<div id="upgrades" class="p hide"><h2>UPGRADES</h2><div id="ul"></div><button id="ub">BACK</button></div>
<div id="leader" class="p hide"><h2>LEADERBOARD</h2><button id="ld" class="diff">EASY</button><div id="scores"></div><button id="lbback">BACK</button></div>
<div id="settings" class="p hide"><h2>SETTINGS</h2><div class="card">Driving controls<br><button id="mode">BUTTONS</button></div><div class="card">Music <input id="music" type="range" min="0" max="100"></div><div class="card">SFX <input id="sfx" type="range" min="0" max="100"></div><div class="card">Song<br><button id="song">TRACK 1</button></div><button id="sb">BACK</button></div>
<div id="crash" class="p hide"><h2>CRASH!</h2><p>Time: <b id="ft"></b></p><p>Distance: <b id="fd"></b></p><p>Score: <b id="fs"></b></p><p>Best: <b id="fb"></b></p><button id="retry">RETRY</button><button id="cm">MENU</button><button id="cl">LEADERBOARD</button></div>
<div id="hud" class="hide"><div id="speed" class="stat leftstat">0 MPH</div><div id="score" class="stat rightstat">0</div><div id="status" class="status"></div><div class="controls"><div><button class="ctrl" id="left">◀</button><button class="ctrl" id="right">▶</button></div><div><button class="ctrl pedal brake" id="brake">BRAKE</button><button class="ctrl pedal gas" id="gas">GAS</button></div></div></div></div>
<script>
const C=document.getElementById('c'),X=C.getContext('2d');let W,H,roadX,roadW,run=false,last=0,t=0,dist=0,score=0,spawn=0,traffic=[],player,cash=+localStorage.getItem('cash')||10000,diff=localStorage.getItem('diff')||'Easy',mode=localStorage.getItem('mode')||'buttons',music=70,sfx=70,song=1;
const D=['Easy','Medium','Hard','Extreme'],cfg={Easy:[55,1.25],Medium:[68,1],Hard:[82,.78],Extreme:[98,.6]},upgrades=[['Twin Turbo',5400],['Supercharger',3600],['Large Turbo',4700],['Sport Brakes',1300],['Race Brakes',2100],['Race Spoiler',1100],['Front Bumper',1200],['Rear Bumper',1200],['Grip Tires',1500]],owned=JSON.parse(localStorage.getItem('owned')||'[]'),keys={left:0,right:0,gas:0,brake:0};
function resize(){W=innerWidth;H=innerHeight;C.width=W*devicePixelRatio;C.height=H*devicePixelRatio;X.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);roadW=Math.min(W*.72,520);roadX=(W-roadW)/2}addEventListener('resize',resize);resize();
function panels(id){['menu','upgrades','leader','settings','crash'].forEach(x=>document.getElementById(x).classList.toggle('hide',x!==id));}
function dc(el,v){el.textContent=v.toUpperCase();el.className='diff '+v.toLowerCase()}
function cyc(v){return D[(D.indexOf(v)+1)%4]}function cashUI(){document.getElementById('cash').textContent='$'+cash.toLocaleString()}dc(dif,diff);dc(ld,diff);cashUI();
dif.onclick=()=>{diff=cyc(diff);localStorage.setItem('diff',diff);dc(dif,diff)};ld.onclick=()=>{diff=cyc(diff);dc(ld,diff);scores()};
play.onclick=start;retry.onclick=start;up.onclick=()=>{upgradesUI();panels('upgrades')};ub.onclick=()=>panels('menu');lb.onclick=()=>{scores();panels('leader')};lbback.onclick=()=>panels('menu');set.onclick=()=>{settingsUI();panels('settings')};sb.onclick=()=>{saveSettings();panels('menu')};cm.onclick=()=>panels('menu');cl.onclick=()=>{scores();panels('leader')};
function upgradesUI(){ul.innerHTML='';upgrades.forEach((u,i)=>{let d=document.createElement('div');d.className='card';d.innerHTML='<b>'+u[0]+'</b><span class="price">'+(owned.includes(i)?'OWNED':'$'+u[1].toLocaleString())+'</span>';if(!owned.includes(i))d.onclick=()=>{if(cash>=u[1]){cash-=u[1];owned.push(i);localStorage.setItem('cash',cash);localStorage.setItem('owned',JSON.stringify(owned));cashUI();upgradesUI()}};ul.appendChild(d)})}
function settingsUI(){modeBtn();music.value=music;sfx.value=sfx;songBtn()}function modeBtn(){modeEl.textContent=mode.toUpperCase()}function songBtn(){songEl.textContent='TRACK '+song}const modeEl=document.getElementById('mode'),songEl=document.getElementById('song');modeEl.onclick=()=>{mode=mode==='buttons'?'gyro':'buttons';modeBtn()};songEl.onclick=()=>{song=song%3+1;songBtn()};music.oninput=()=>music=+music.value;sfx.oninput=()=>sfx=+sfx.value;function saveSettings(){localStorage.setItem('mode',mode)}
function start(){panels(null);hud.classList.remove('hide');t=dist=score=spawn=0;traffic=[];player={x:W/2,y:H*.68,w:30,h:52,s:0};run=true;last=performance.now();requestAnimationFrame(loop)}
function bind(id,k){let b=document.getElementById(id);b.onpointerdown=e=>{e.preventDefault();keys[k]=1};b.onpointerup=b.onpointercancel=b.onpointerleave=e=>{e.preventDefault();keys[k]=0}}['left','right','gas','brake'].forEach(k=>bind(k,k));addEventListener('keydown',e=>{if(e.key==='ArrowLeft')keys.left=1;if(e.key==='ArrowRight')keys.right=1;if(e.key==='ArrowUp')keys.gas=1;if(e.key==='ArrowDown')keys.brake=1});addEventListener('keyup',e=>{if(e.key==='ArrowLeft')keys.left=0;if(e.key==='ArrowRight')keys.right=0;if(e.key==='ArrowUp')keys.gas=0;if(e.key==='ArrowDown')keys.brake=0});let tilt=0;addEventListener('deviceorientation',e=>{if(e.gamma!=null)tilt=Math.max(-1,Math.min(1,e.gamma/35))});
function loop(now){if(!run)return;let dt=Math.min(.035,(now-last)/1000);last=now;update(dt);draw();requestAnimationFrame(loop)}
function update(dt){let target=keys.gas?105:55;if(keys.brake)target=0;player.s+=(target-player.s)*dt*2.2;player.x+=(mode==='gyro'?tilt:(keys.right-keys.left))*260*dt;player.x=Math.max(roadX+25,Math.min(roadX+roadW-25,player.x));let active=player.s>=30;status.textContent=active?'':'TIMER PAUSED — SPEED TOO LOW';if(active){t+=dt;dist+=player.s*.44704*dt;score=Math.floor(t*10+dist);spawn-=dt;if(spawn<=0){let lane=Math.floor(Math.random()*3);traffic.push({x:roadX+roadW*(lane+.5)/3,y:-70,w:29,h:50,s:cfg[diff][0]*(.7+Math.random()*.5)});spawn=cfg[diff][1]}}traffic.forEach(v=>v.y+=(v.s+player.s*.35)*dt*(player.s/60));traffic=traffic.filter(v=>v.y<H+80);if(active)for(let v of traffic)if(Math.abs(player.x-v.x)<29&&Math.abs(player.y-v.y)<51)return crash();speed.textContent=Math.round(player.s)+' MPH';scoreEl.textContent=score.toLocaleString()}
function car(x,y,w,h,hero=false){X.save();X.translate(x,y);X.fillStyle=hero?'#d72e32':'#e8e8e8';X.fillRect(-w/2,-h/2,w,h);X.fillStyle='#111';X.fillRect(-w*.38,-h*.28,w*.76,h*.2);X.fillRect(-w*.38,h*.07,w*.76,h*.2);X.restore()}
function draw(){X.clearRect(0,0,W,H);X.fillStyle='#315d2e';X.fillRect(0,0,W,H);X.fillStyle='#555';X.fillRect(roadX,0,roadW,H);X.strokeStyle='#ddd';X.lineWidth=4;X.setLineDash([24,28]);for(let i=1;i<3;i++){X.beginPath();X.moveTo(roadX+roadW*i/3,0);X.lineTo(roadX+roadW*i/3,H);X.stroke()}X.setLineDash([]);traffic.forEach(v=>car(v.x,v.y,v.w,v.h));car(player.x,player.y,player.w,player.h,true)}
function crash(){run=false;let k='scores_'+diff,a=JSON.parse(localStorage.getItem(k)||'[]');a.push({s:score,t,d:dist});a.sort((a,b)=>b.s-a.s);a=a.slice(0,10);localStorage.setItem(k,JSON.stringify(a));ft.textContent=t.toFixed(1)+'s';fd.textContent=Math.round(dist)+' m';fs.textContent=score.toLocaleString();fb.textContent=a[0].s.toLocaleString();hud.classList.add('hide');panels('crash')}
function scores(){let a=JSON.parse(localStorage.getItem('scores_'+diff)||'[]');scoresEl.innerHTML=a.length?a.map((x,i)=>'<div class="card">#'+(i+1)+' — '+x.s.toLocaleString()+' pts<br><small>'+x.t.toFixed(1)+'s • '+Math.round(x.d)+'m</small></div>').join(''):'<p>No runs yet.</p>'}
const cashEl=document.getElementById('cash'),dif=document.getElementById('dif'),ld=document.getElementById('ld'),ul=document.getElementById('ul'),musicEl=document.getElementById('music'),sfxEl=document.getElementById('sfx'),hud=document.getElementById('hud'),speed=document.getElementById('speed'),scoreEl=document.getElementById('score'),status=document.getElementById('status'),scoresEl=document.getElementById('scores');
panels('menu');
</script></body></html>
