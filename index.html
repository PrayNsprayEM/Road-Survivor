<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Road Survivor</title>
<style>
*{box-sizing:border-box;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#151515;font-family:system-ui;color:white;touch-action:none}canvas{width:100%;height:100%;display:block;image-rendering:pixelated}.p{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(92%,430px);padding:22px;background:#111e;border:2px solid white;border-radius:14px;text-align:center;box-shadow:0 8px 30px #000}.hide{display:none}button{margin:5px;padding:13px 18px;border:2px solid white;border-radius:10px;background:#292933;color:white;font-weight:800;font-size:17px;min-width:145px}.diff{font-size:21px}.easy{background:#2e9b4b}.medium{background:#c6a51b}.hard{background:#d66b18}.extreme{background:#c93636}.card{background:#202027;border:1px solid #555;border-radius:9px;padding:10px;margin:6px;text-align:left}.price{float:right}.stat{position:absolute;top:10px;background:#000b;padding:8px 12px;border-radius:8px;font-weight:900;border:1px solid #ffffff22;backdrop-filter:blur(4px)}.leftstat{left:10px}.rightstat{right:10px}.status{position:absolute;top:52px;left:50%;transform:translateX(-50%);font-weight:900}#nearMissToast{position:absolute;top:78px;left:50%;transform:translateX(-50%);font-weight:900;font-size:14px;color:#ffd60a;text-shadow:0 2px 5px #000;white-space:nowrap;pointer-events:none;opacity:0}.controls{position:absolute;bottom:14px;left:0;right:0;display:flex;justify-content:space-between;padding:0 14px}.ctrl{width:74px;height:65px;padding:0;margin:0;font-size:25px;background:#222c;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}.pedal{width:78px;height:75px;font-size:15px}.brake{background:#a32f2fcc}.gas{background:#309346cc}

.dealer{width:min(96%,920px);height:min(90%,560px);padding:0;overflow:hidden;background:#0d0d10;border:2px solid #38bdf8}
.dealerTop{height:64px;background:#342842;display:flex;align-items:center;justify-content:space-between;padding:8px 14px;border-bottom:5px solid #22b7f0}
.dealerCash{font-size:28px;font-weight:950}.dealerBack{min-width:120px;margin:0}
.showroom{height:calc(100% - 64px);display:grid;grid-template-columns:80px 1fr minmax(200px,30%) 80px;align-items:center;background:radial-gradient(circle at 50% 28%,#404046 0 7%,#25252a 35%,#111 68%,#060606 100%);position:relative;overflow:hidden}
.arrowBtn{min-width:0;width:62px;height:90px;font-size:46px;padding:0;border:0;background:transparent}
.carStage{text-align:center;align-self:stretch;display:flex;flex-direction:column;justify-content:center;min-width:0;position:relative}.carStage:before{content:'';position:absolute;left:8%;right:8%;bottom:22%;height:18%;background:radial-gradient(ellipse,#ffffff1f 0,#ffffff08 45%,transparent 72%);filter:blur(3px);pointer-events:none}
#dealerCanvas{width:100%;height:240px;max-height:42vh}
.carName{font-size:28px;font-weight:950;margin-top:-8px}
.buyCar{background:linear-gradient(#34bdf2,#168bc4);min-width:210px;font-size:22px;box-shadow:0 6px 0 #0b5d85,0 12px 22px #0008}
.carSpecs{text-align:left;align-self:start;margin-top:22px;padding:18px;background:#101014dd;border:1px solid #ffffff22;border-radius:12px;font-weight:800;line-height:1.6;box-shadow:0 10px 30px #0008}
.carSpecs h3{font-size:24px;margin:0 0 10px}
@media(max-width:700px){
  .dealerTop{height:52px}.dealerCash{font-size:21px}.dealerBack{min-width:95px;padding:8px}
  .showroom{height:calc(100% - 52px);grid-template-columns:54px 1fr 145px 54px}
  .arrowBtn{width:48px;font-size:36px}.carSpecs{font-size:12px;padding-top:16px}
  .carSpecs h3{font-size:17px}.carName{font-size:21px}.buyCar{min-width:160px;font-size:17px;padding:9px}
  #dealerCanvas{height:170px}
}


.showroom:before{content:'';position:absolute;left:0;right:0;bottom:0;height:31%;background:linear-gradient(#1110,#0008),repeating-linear-gradient(100deg,#111 0 44px,#151515 44px 88px);border-top:1px solid #ffffff16;pointer-events:none}
.carName{position:relative;z-index:2;text-shadow:0 2px 5px #000}
#dealerCanvas{position:relative;z-index:2;filter:drop-shadow(0 18px 12px #000b)}

.upgradeHeader{display:flex;align-items:center;justify-content:center;gap:18px;margin-bottom:14px}
.upgradeHeader h2{margin:0}
.upgradeCarName{font-size:13px;opacity:.75;margin-top:3px}
.upgradeCats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;max-width:760px;margin:10px auto}
.upgradeCat{min-height:180px;border-radius:18px;border:2px solid #ffffff28;background:linear-gradient(#252b35,#11151b);color:#fff;padding:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;box-shadow:0 10px 24px #0007}
.upgradeCat:active{transform:scale(.98)}
.upgradeCat b{font-size:23px;letter-spacing:1px}
.upgradeCat span{font-size:12px;opacity:.7}
.upgradeArt{width:110px;height:78px;position:relative;margin-bottom:4px}
.engineBody{position:absolute;left:23px;top:29px;width:62px;height:36px;border:4px solid #b8c0cc;background:#687180;border-radius:8px}
.engineTop{position:absolute;left:35px;top:15px;width:38px;height:19px;border:4px solid #c7ced7;background:#7c8695;border-radius:6px}
.enginePipe{position:absolute;left:83px;top:36px;width:23px;height:11px;border:5px solid #b8c0cc;border-left:0;border-radius:0 8px 8px 0}
.brakeDisc{position:absolute;left:24px;top:5px;width:70px;height:70px;border-radius:50%;border:10px solid #aeb6c1;box-sizing:border-box;background:#3c424c}
.brakeHub{position:absolute;left:49px;top:30px;width:20px;height:20px;border-radius:50%;background:#c9cfd7;border:5px solid #626b78}
.brakeCaliper{position:absolute;right:11px;top:19px;width:24px;height:42px;border-radius:8px;background:#9aa3af;border:4px solid #c2c9d2}
.spoilerWing{position:absolute;left:10px;top:18px;width:92px;height:18px;background:#a9b0ba;border:3px solid #d0d5dc;border-radius:7px;transform:skewX(-10deg)}
.spoilerPost{position:absolute;top:39px;width:8px;height:30px;background:#7c8592}
.post1{left:35px}.post2{right:32px}
.liveryRoll{position:absolute;left:17px;top:12px;width:38px;height:38px;border-radius:50%;border:9px solid #aeb6c1;box-sizing:border-box;background:#39404a}
.liverySheet{position:absolute;left:47px;top:25px;width:53px;height:37px;border-radius:4px;background:linear-gradient(135deg,#c0c6ce 0 25%,#5d6673 25% 50%,#a9b0ba 50% 75%,#454d59 75%)}
.liveryStripe{position:absolute;left:50px;top:39px;width:48px;height:6px;background:#1c2027;transform:rotate(-8deg)}
.upgradeDetailHead{display:flex;align-items:center;justify-content:center;gap:16px;margin:8px 0 12px}
.upgradeDetailHead h3{margin:0;font-size:22px}
#upgradeDetail #ul{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;max-width:760px;margin:0 auto}
@media(max-width:700px){.upgradeCats,#upgradeDetail #ul{grid-template-columns:1fr}.upgradeCat{min-height:145px}}



/* Reliable iPhone Safari upgrades scrolling */
body.upgradesOpen{
  touch-action:auto !important;
  overflow:hidden;
}
body.upgradesOpen #upgrades{
  touch-action:pan-y !important;
}

#upgrades.p{
  position:absolute;
  top:0;
  bottom:0;
  left:50%;
  transform:translateX(-50%);
  width:min(96%,760px);
  height:auto;
  max-height:none;
  margin:0;
  overflow-x:hidden;
  overflow-y:scroll !important;
  -webkit-overflow-scrolling:touch;
  overscroll-behavior-y:contain;
  touch-action:pan-y !important;
  padding:22px 22px 180px;
  border-radius:0;
}

#upgrades .upgradeCats,
#upgrades #upgradeDetail,
#upgrades #ul{
  touch-action:pan-y !important;
}

#upgrades .upgradeCat,
#upgrades .card,
#upgrades button{
  touch-action:manipulation !important;
}

#upgradeDetail{
  padding-bottom:120px;
}


#upgradeDetail .upgradeDetailHead{
  position:sticky;
  top:0;
  z-index:5;
  background:#111;
  padding:10px 0 12px;
}
#upgradeCatBack{
  min-width:110px;
}

</style>

function update(dt){

let target=throttle?Math.min(carData.top,108):68;
if(braking)target=0;
if(performance.now()<nosUntil)target=Math.min(carData.top+40,148);

let accel=selectedCar==='mx5'?27:23;
let brakePower=42;
if(player.s<target)player.s=Math.min(target,player.s+accel*dt);
else player.s=Math.max(target,player.s-(braking?brakePower:13)*dt);

let steerInput=mode==='gyro'?tilt:(keys.right-keys.left);
let speedFactor=.35+Math.min(player.s/100,1)*.75;
steerVel+=(steerInput*330*speedFactor-steerVel)*Math.min(1,dt*8);

let lane=Math.floor(Math.random()*3),r=Math.random(),type='car',w=29,h=50;
if(r<c.trailer){type='trailer';w=38;h=105}
else if(r<c.trailer+c.truck){type='truck';w=35;h=66}
else{
let shapes=['car','sedan','hatch','sports'];type=shapes[Math.floor(Math.random()*shapes.length)];

if(type==='hatch'){w=30;h=45}

}

x:laneCenter,y:-h-18,w,h,type,lane,

prevY:-h-18,

});

}
if(Math.random()<c.power){
let type=Math.random()<.5?'invis':'nos';
powerUps.push({x:roadX+30+Math.random()*(roadW-60),y:-35,w:30,h:30,type,s:90+Math.random()*25})
}
}

traffic.forEach(v=>{
v.prevY=v.y;
v.y+=(v.s+player.s*.38)*dt*(.65+player.s/115);
v.laneTimer=(v.laneTimer??2)-dt;

if(v.laneTimer<=0){
  // Random chance to change one lane left or right.
  if(Math.random()<.42){
    let dir=Math.random()<.5?-1:1;
    let nextLane=Math.max(0,Math.min(2,(v.lane??1)+dir));
    if(nextLane!==(v.lane??1)){
      v.lane=nextLane;
      v.targetX=roadX+roadW*(nextLane+.5)/3;
    }
  }
  v.laneTimer=2.2+Math.random()*5.5;
}

if(v.targetX==null)v.targetX=v.x;
v.x+=(v.targetX-v.x)*Math.min(1,dt*1.8);
});
if(active&&performance.now()>=invisibleUntil){
for(let v of traffic){

let crossed=v.prevY<player.y&&v.y>=player.y;
if(!crossed)continue;

if(xGap>=hitGap&&xGap<nearGap){
v.nearMissAwarded=true;

}
if(performance.now()>=nearMissUntil)els.nearMissToast.style.opacity='0';
traffic=traffic.filter(v=>v.y<H+150);
powerUps.forEach(p=>p.y+=(p.s+player.s*.18)*dt);powerUps=powerUps.filter(p=>p.y<H+50);

for(let i=powerUps.length-1;i>=0;i--){
let p=powerUps[i];
if(Math.abs(player.x-p.x)<34&&Math.abs(player.y-p.y)<44){
if(p.type==='invis')invisibleUntil=performance.now()+5000;
if(p.type==='nos')nosUntil=performance.now()+3000;
powerUps.splice(i,1)
}}

if(active&&performance.now()>=invisibleUntil){
for(let v of traffic){
if(Math.abs(player.x-v.x)<(player.w+v.w)*.46&&Math.abs(player.y-v.y)<(player.h+v.h)*.46){shake=.35;return crashGame()}
}}
els.speed.textContent=Math.round(player.s)+' MPH';
els.score.textContent=score.toLocaleString()
}
function car(x,y,w,h,hero=false,type='car'){
X.save();X.translate(x,y);
X.shadowColor='#0009';X.shadowBlur=8;X.shadowOffsetY=6;
let body=hero?(selectedCar==='mx5'?'#e32636':'#d72e32'):
(type==='truck'?'#d18a2e':type==='trailer'?'#d9d9d9':type==='sports'?'#2563eb':type==='hatch'?'#42a85a':type==='sedan'?'#dadada':'#ececec');
X.fillStyle=body;
X.beginPath();X.roundRect(-w/2,-h/2,w,h,Math.min(5,w*.18));X.fill();
X.shadowBlur=0;X.shadowOffsetY=0;
X.fillStyle='#1b2630';X.fillRect(-w*.34,-h*.30,w*.68,h*.18);X.fillRect(-w*.34,h*.08,w*.68,h*.15);
X.fillStyle='#fff9b0';X.fillRect(-w*.39,-h*.47,w*.22,4);X.fillRect(w*.17,-h*.47,w*.22,4);
X.fillStyle='#e22';X.fillRect(-w*.38,h*.42,w*.18,4);X.fillRect(w*.20,h*.42,w*.18,4);
if(type==='trailer'){X.fillStyle='#aaa';X.fillRect(-w*.40,-h*.02,w*.80,h*.38);X.strokeStyle='#888';X.strokeRect(-w*.40,-h*.02,w*.80,h*.38)}
X.restore()
}
function draw(){
X.clearRect(0,0,W,H);X.save();
if(shake>0)X.translate((Math.random()-.5)*7*shake,(Math.random()-.5)*7*shake);

let grass=X.createLinearGradient(0,0,0,H);grass.addColorStop(0,'#477c43');grass.addColorStop(1,'#244923');
X.fillStyle=grass;X.fillRect(0,0,W,H);

X.fillStyle='#777';X.fillRect(roadX-9,0,9,H);X.fillRect(roadX+roadW,0,9,H);
X.fillStyle='#e7e7e7';X.fillRect(roadX-3,0,3,H);X.fillRect(roadX+roadW,0,3,H);

let asphalt=X.createLinearGradient(roadX,0,roadX+roadW,0);
asphalt.addColorStop(0,'#363636');asphalt.addColorStop(.5,'#4c4c4c');asphalt.addColorStop(1,'#363636');
X.fillStyle=asphalt;X.fillRect(roadX,0,roadW,H);

X.fillStyle='#ffffff08';
for(let i=0;i<50;i++){let xx=roadX+((i*97)%Math.max(1,roadW)),yy=(i*131+roadOffset*3)%Math.max(1,H);X.fillRect(xx,yy,1,1)}

X.strokeStyle='#f5f5f5';X.lineWidth=4;X.setLineDash([28,36]);X.lineDashOffset=roadOffset;
for(let i=1;i<3;i++){X.beginPath();X.moveTo(roadX+roadW*i/3,0);X.lineTo(roadX+roadW*i/3,H);X.stroke()}
X.setLineDash([]);

for(let y=-40+(roadOffset%48);y<H+40;y+=48){X.fillStyle='#f7ef9a';X.fillRect(roadX-13,y,5,10);X.fillRect(roadX+roadW+8,y,5,10)}

traffic.forEach(v=>{
X.save();
if(performance.now()<invisibleUntil)X.globalAlpha=.28;
car(v.x,v.y,v.w,v.h,false,v.type);
X.restore();
});
powerUps.forEach(p=>{
X.save();X.shadowColor=p.type==='invis'?'#6ee7ff':'#ffd60a';X.shadowBlur=18;X.beginPath();X.arc(p.x,p.y,15,0,Math.PI*2);
X.fillStyle=p.type==='invis'?'#8eeaff':'#ffd60a';X.fill();X.shadowBlur=0;X.fillStyle='#111';X.font='bold 10px system-ui';X.textAlign='center';X.textBaseline='middle';
X.fillText(p.type==='invis'?'INVIS':'NOS',p.x,p.y);X.restore()
});
X.save();car(player.x,player.y,player.w,player.h,true);X.restore();

if(player.s>85){let g=X.createRadialGradient(W/2,H/2,Math.min(W,H)*.25,W/2,H/2,Math.max(W,H)*.7);g.addColorStop(0,'#0000');g.addColorStop(1,'#0005');X.fillStyle=g;X.fillRect(0,0,W,H)}
X.restore()
}
function crashGame(){
  run=false;
  let reward=Math.floor(score/100)*10;
  cash+=reward;
  localStorage.setItem('cash',cash);

  let k='scores_'+diff,a=JSON.parse(localStorage.getItem(k)||'[]');
  if(!Array.isArray(a))a=[];
  let oldBest=a.sort((x,y)=>(y.s||0)-(x.s||0))[0]||null;
  let best=(!oldBest||score>oldBest.s)?{s:score,t,d:dist}:oldBest;
  localStorage.setItem(k,JSON.stringify([best]));

  els.ft.textContent=t.toFixed(1)+'s';
  els.fd.textContent=Math.round(dist)+' m';
  els.fs.textContent=score.toLocaleString();
  els.earnings.textContent='$'+reward.toLocaleString();
  els.fb.textContent=best.s.toLocaleString();
  cashUI();
  els.hud.classList.add('hide');
  panels('crash')
}
els.dif.onclick=()=>{diff=cyc(diff);localStorage.setItem('diff',diff);dc(els.dif,diff)};
els.play.onclick=start;els.retry.onclick=start;
els.up.onclick=()=>{upgradesUI();panels('upgrades')};
document.querySelectorAll('.upgradeCat').forEach(b=>b.onclick=()=>upgradesUI(b.dataset.cat));
els.upgradeCatBack.onclick=()=>{upgradesUI();els.upgrades.scrollTop=0};
els.ub.onclick=()=>{controlLayout();panels('menu')};
els.dealerBtn.onclick=()=>{dealerIndex=Math.max(0,cars.findIndex(c=>c.id===selectedCar));dealerUI();panels('dealership')};
els.dealerBack.onclick=()=>{cashUI();panels('menu')};
els.dealerPrev.onclick=()=>{dealerIndex=(dealerIndex-1+cars.length)%cars.length;dealerUI()};
els.dealerNext.onclick=()=>{dealerIndex=(dealerIndex+1)%cars.length;dealerUI()};
els.dealerBuy.onclick=dealerPurchaseOrSelect;
els.lb.onclick=()=>{scores();panels('leader')};els.lbback.onclick=()=>panels('menu');els.set.onclick=()=>{settingsUI();panels('settings')};els.sb.onclick=()=>{saveSettings();panels('menu')};els.cm.onclick=()=>panels('menu');els.cl.onclick=()=>{scores();panels('leader')};
els.mode.onclick=async()=>{
  if(mode==='buttons'){
    const ok=await requestGyroPermission();
    if(!ok)return;
    mode='gyro';
  }else{
    mode='buttons';
    tilt=0;
  }
  modeBtn();
  controlLayout();
  saveSettings();
};els.song.onclick=()=>{song=song%3+1;songBtn()};els.music.oninput=()=>musicVol=+els.music.value;els.sfx.oninput=()=>sfxVol=+els.sfx.value;
dc(els.dif,diff);cashUI();dealerUI();panels('menu');
</script></body></html>
