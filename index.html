    'Content-Type':'application/json'
  },opts.headers||{});

async function syncMyBest(d){
  const b=bestRunFor(d);
  const bestScore=b?Number(b.s)||0:0;
  if(!bestScore) return;
  try{
    await lbRequest('leaderboard_scores?on_conflict=player_id,difficulty',{
      method:'POST',
      headers:{'Prefer':'resolution=merge-duplicates,return=minimal'},
      body:JSON.stringify({
        player_id:getPlayerId(),
        player_name:'PLAYER',
        difficulty:d,
        score:bestScore
      })
    });
  }catch(e){ console.warn(e); }
}

async function scores(){
  const list=document.getElementById('top100List');
  const placeEl=document.getElementById('yourRankPlace');
  const scoreEl=document.getElementById('yourRankScore');
  const rankBar=document.getElementById('yourRankBar');
  if(!list)return;

  });

  list.innerHTML='<div class="lbRow"><span>—</span><span>LOADING…</span><span class="score">—</span></div>';

  await syncMyBest(lbSelected);

  try{
    const rows=await lbRequest(
      'leaderboard_scores?difficulty=eq.'+encodeURIComponent(lbSelected)+
      '&select=player_id,player_name,score&order=score.desc&limit=100'
    );

    const me=getPlayerId();

    if(!rows.length){
      list.innerHTML='<div class="lbRow"><span>—</span><span>NO SCORES YET</span><span class="score">—</span></div>';
      if(rankBar) rankBar.style.display='none';
      return;
    }

    list.innerHTML=rows.map((r,i)=>{
      const isMe=r.player_id===me;
      return '<div class="lbRow'+(isMe?' me':'')+'">'+
        '<span>#'+(i+1)+'</span>'+
        '<span>'+(isMe?'YOU':'PLAYER')+'</span>'+
        '<span class="score">'+Number(r.score||0).toLocaleString()+'</span>'+
        '</div>';
    }).join('');

    const myIndex=rows.findIndex(r=>r.player_id===me);
    if(myIndex>=0){
      if(placeEl) placeEl.textContent='#'+(myIndex+1);
      if(scoreEl) scoreEl.textContent=Number(rows[myIndex].score||0).toLocaleString();
      if(rankBar) rankBar.style.display='grid';
      requestAnimationFrame(()=>{
        const row=list.querySelector('.lbRow.me');
        if(row) row.scrollIntoView({block:'center',behavior:'auto'});
      });
    }else{
      const b=bestRunFor(lbSelected);
      const myScore=b?Number(b.s)||0:0;
      if(placeEl) placeEl.textContent='—';
      if(scoreEl) scoreEl.textContent=myScore.toLocaleString();
      if(rankBar) rankBar.style.display='grid';
    }
  }catch(e){
    console.warn(e);
    list.innerHTML='<div class="lbRow"><span>!</span><span>LEADERBOARD OFFLINE</span><span class="score">—</span></div>';
  }
}

async function requestGyroPermission(){

function roadsideTree(x,y,scale=1,variant=0){
  X.save();X.translate(x,y);X.scale(scale,scale);

  // Long soft shadow
  X.save();
  X.globalAlpha=.23;X.fillStyle='#0c1b0d';
  X.beginPath();X.ellipse(9,13,21,9,-.22,0,Math.PI*2);X.fill();
  X.restore();

  // Trunk
  X.fillStyle=variant%2?'#755136':'#62432e';
  X.fillRect(-4,-1,8,25);
  X.fillStyle='rgba(255,255,255,.10)';
  X.fillRect(-2,1,2,19);

  // Dense leafy crown made from overlapping circles
  const palette=variant%3===0?['#133d20','#1f5b2c','#2f7638','#4a914c']:
                variant%3===1?['#173f25','#285f32','#397a3e','#559650']:
                               ['#12391e','#205a2e','#34753b','#4d8d49'];
  const blobs=[
    [-10,-12,14,1], [10,-12,14,1], [0,-22,16,2],
    [-13,-25,11,2], [13,-25,11,2], [0,-35,12,3],
    [-2,-13,18,0]
  ];
  blobs.forEach(([bx,by,r,pi])=>{
    X.fillStyle=palette[pi];
    X.beginPath();X.arc(bx,by,r,0,Math.PI*2);X.fill();
  });

  // Tiny highlights so they read as trees on a phone screen.
  X.globalAlpha=.22;X.fillStyle='#d8f3c6';
  X.beginPath();X.arc(-8,-31,5,0,Math.PI*2);X.fill();
  X.beginPath();X.arc(8,-22,4,0,Math.PI*2);X.fill();

  X.restore();
}
function drawRoadsideTrees(){
  const spacing=76;
  const travel=(roadOffset*1.6)%spacing;
  const leftBase=Math.max(24,roadX-30);
  const rightBase=Math.min(W-24,roadX+roadW+30);

  for(let i=-2;i<Math.ceil(H/spacing)+3;i++){
    const y=i*spacing+travel;
    const sway=(i%3)*5;

    roadsideTree(leftBase-sway,y,0.82+(i%3)*.07,i);
    roadsideTree(rightBase+sway,y+spacing*.48,0.80+((i+1)%3)*.07,i+7);
  }
}

// --- Racing realism layer ---
let roadNoiseOffset=0;
let cameraLean=0;
let suspensionBob=0;
let speedLinePhase=0;

function drawRealisticRoadFX(){
  if(!X || !C) return;
  const w=C.width,h=C.height;
  const roadL=w*.12, roadR=w*.88;
  const mph=Math.max(0,speed||0);
  roadNoiseOffset=(roadNoiseOffset + mph*.45)%(h+24);
  speedLinePhase=(speedLinePhase + mph*.12)%1000;

  X.save();

  // Subtle asphalt grain and moving tar seams.
  X.globalAlpha=.10;
  X.fillStyle='#d5d5d5';
  for(let i=0;i<34;i++){
    const yy=(i*47 + roadNoiseOffset*1.7)%(h+60)-30;
    const xx=roadL+12+((i*83)%Math.max(1,(roadR-roadL-24)));
    X.fillRect(xx,yy,2+(i%3),1);
  }
  X.globalAlpha=.08;
  X.strokeStyle='#101010';
  X.lineWidth=2;
  for(let i=0;i<6;i++){
    const x=roadL+40+i*((roadR-roadL-80)/5);
    X.beginPath();
    X.moveTo(x,-20);
    for(let y=-20;y<h+30;y+=55){
      X.lineTo(x+Math.sin((y+roadNoiseOffset+i*17)*.025)*4,y);
    }
    X.stroke();
  }

  // Road-edge motion blur at higher speed.
  if(mph>70){
    const a=Math.min(.22,(mph-70)/420);
    X.globalAlpha=a;
    X.strokeStyle='#ffffff';
    X.lineWidth=2;
    for(let i=0;i<12;i++){
      const y=(i*67 + speedLinePhase*2)%(h+90)-45;
      X.beginPath();X.moveTo(roadL+8,y);X.lineTo(roadL+8,y+26+mph*.08);X.stroke();
      X.beginPath();X.moveTo(roadR-8,y);X.lineTo(roadR-8,y+26+mph*.08);X.stroke();
    }
  }

  // Subtle camera/suspension motion, strongest at speed.
  suspensionBob=Math.sin(performance.now()*.012)*(Math.min(mph,150)/150)*1.5;
  cameraLean += (((keys&&keys.left)?-1:0)+((keys&&keys.right)?1:0)-cameraLean)*.08;

  // Speed vignette.
  if(mph>90){
    const a=Math.min(.23,(mph-90)/300);
    const g=X.createRadialGradient(w/2,h*.55,Math.min(w,h)*.20,w/2,h*.55,Math.max(w,h)*.72);
    g.addColorStop(.55,'rgba(0,0,0,0)');
    g.addColorStop(1,'rgba(0,0,0,'+a+')');
    X.fillStyle=g;X.fillRect(0,0,w,h);
  }

  X.restore();
}

}

let crashExplosionRAF=0;
function playCrashExplosion(done){
  const startTime=performance.now();
  const ex=player.x, ey=player.y;
  cancelAnimationFrame(crashExplosionRAF);

  function frame(now){
    draw();

    const p=Math.min(1,(now-startTime)/1000);
    const ease=1-Math.pow(1-p,2);

    X.save();
    X.globalCompositeOperation='lighter';

    // Bright expanding fireball.
    const radius=18+105*ease;
    const glow=X.createRadialGradient(ex,ey,0,ex,ey,radius);
    glow.addColorStop(0,'rgba(255,255,235,'+(1-p*.7)+')');
    glow.addColorStop(.18,'rgba(255,220,80,'+(1-p*.45)+')');
    glow.addColorStop(.5,'rgba(255,105,0,'+(1-p*.65)+')');
    glow.addColorStop(1,'rgba(190,25,0,0)');
    X.fillStyle=glow;
    X.beginPath();X.arc(ex,ey,radius,0,Math.PI*2);X.fill();

    // Shockwave ring.
    X.globalAlpha=Math.max(0,1-p);
    X.strokeStyle='#ffd27a';
    X.lineWidth=Math.max(2,8*(1-p));
    X.beginPath();X.arc(ex,ey,25+125*ease,0,Math.PI*2);X.stroke();

    // Flying sparks/debris.
    for(let i=0;i<28;i++){
      const a=(i/28)*Math.PI*2+(i%4)*.21;
      const speed=45+(i%7)*13;
      const rr=10+speed*ease;
      const px=ex+Math.cos(a)*rr;
      const py=ey+Math.sin(a)*rr+(38*p*p);
      const sz=Math.max(1,7*(1-p));
      X.fillStyle=i%3===0?'#fff2a8':(i%3===1?'#ff9f1c':'#ff3b0a');
      X.fillRect(px-sz/2,py-sz/2,sz,sz);
    }

    // Smoke toward the end.
    X.globalCompositeOperation='source-over';
    for(let i=0;i<7;i++){
      const a=(i/7)*Math.PI*2;
      const rr=18+45*ease;
      X.globalAlpha=.28*p*(1-p*.5);
      X.fillStyle='#202020';
      X.beginPath();
      X.arc(ex+Math.cos(a)*rr,ey+Math.sin(a)*rr-35*p,15+23*p,0,Math.PI*2);
      X.fill();
    }
    X.restore();

    if(p<1) crashExplosionRAF=requestAnimationFrame(frame);
    else {
      crashExplosionRAF=0;
      if(done) done();
    }
  }
  crashExplosionRAF=requestAnimationFrame(frame);
}

function crashGame(){

  let best=(!oldBest||score>oldBest.s)?{s:score,t,d:dist}:oldBest;
  localStorage.setItem(k,JSON.stringify([best]));

  els.ft.textContent=t.toFixed(1)+'s';

  els.hud.classList.add('hide');
  playCrashExplosion(()=>panels('crash'));
}
