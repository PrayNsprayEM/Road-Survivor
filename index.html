<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Road Survivor</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#151515;font-family:system-ui;color:white;touch-action:none}canvas{width:100%;height:100%;display:block;image-rendering:pixelated}.p{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(92%,430px);padding:22px;background:#111e;border:2px solid white;border-radius:14px;text-align:center;box-shadow:0 8px 30px #000}.hide{display:none}button{margin:5px;padding:13px 18px;border:2px solid white;border-radius:10px;background:#292933;color:white;font-weight:800;font-size:17px;min-width:145px}.diff{font-size:21px}.easy{background:#2e9b4b}.medium{background:#c6a51b}.hard{background:#d66b18}.extreme{background:#c93636}.card{background:#202027;border:1px solid #555;border-radius:9px;padding:10px;margin:6px;text-align:left}.price{float:right}.stat{position:absolute;top:10px;background:#000a;padding:7px 10px;border-radius:8px;font-weight:800}.leftstat{left:10px}.rightstat{right:10px}.status{position:absolute;top:52px;left:50%;transform:translateX(-50%);font-weight:900}.controls{position:absolute;bottom:14px;left:0;right:0;display:flex;justify-content:space-between;padding:0 14px}.ctrl{width:74px;height:65px;padding:0;margin:0;font-size:25px;background:#222c}.pedal{width:78px;height:75px;font-size:15px}.brake{background:#a32f2fcc}.gas{background:#309346cc}
</style></head><body><canvas id="c"></canvas><div id="ui">
<div id="menu" class="p"><h1>ROAD SURVIVOR</h1><p>Dodge traffic. Survive as long as you can.</p><p>Cash: <b id="cash"></b></p><button id="play">PLAY</button><br><button id="up">UPGRADES</button><button id="lb">LEADERBOARD</button><br><button id="set">SETTINGS</button><p>Difficulty</p><button id="dif" class="diff">EASY</button></div>
<div id="upgrades" class="p hide"><h2>UPGRADES</h2><div id="ul"></div><button id="ub">BACK</button></div>
<div id="leader" class="p hide"><h2>LEADERBOARD</h2><button id="ld" class="diff">EASY</button><div id="scores"></div><button id="lbback">BACK</button></div>
<div id="settings" class="p hide"><h2>SETTINGS</h2><div class="card">Driving controls<br><button id="mode">BUTTONS</button></div><div class="card">Music <input id="music" type="range" min="0" max="100"></div><div class="card">SFX <input id="sfx" type="range" min="0" max="100"></div><div class="card">Song<br><button id="song">TRACK 1</button></div><button id="sb">BACK</button></div>
<div id="crash" class="p hide"><h2>CRASH!</h2><p>Time: <b id="ft"></b></p><p>Distance: <b id="fd"></b></p><p>Score: <b id="fs"></b></p><p>Best: <b id="fb"></b></p><button id="retry">RETRY</button><button id="cm">MENU</button><button id="cl">LEADERBOARD</button></div>
<div id="hud" class="hide"><div id="speed" class="stat leftstat">0 MPH</div><div id="score" class="stat rightstat">0</div><div id="status" class="status"></div><div class="controls" id="controls"><div id="steerControls"><button class="ctrl" id="left">◀</button><button class="ctrl" id="right">▶</button></div><div id="pedalControls"><button class="ctrl pedal brake" id="brake">BRAKE</button><button class="ctrl pedal gas" id="gas">GAS</button></div></div></div></div>
<script>
const C=document.getElementById('c'),X=C.getContext('2d');
const els={
  menu:document.getElementById('menu'),upgrades:document.getElementById('upgrades'),leader:document.getElementById('leader'),settings:document.getElementById('settings'),crash:document.getElementById('crash'),
  cash:document.getElementById('cash'),play:document.getElementById('play'),up:document.getElementById('up'),lb:document.getElementById('lb'),set:document.getElementById('set'),dif:document.getElementById('dif'),
  ul:document.getElementById('ul'),ub:document.getElementById('ub'),ld:document.getElementById('ld'),scores:document.getElementById('scores'),lbback:document.getElementById('lbback'),
  mode:document.getElementById('mode'),music:document.getElementById('music'),sfx:document.getElementById('sfx'),song:document.getElementById('song'),sb:document.getElementById('sb'),
  ft:document.getElementById('ft'),fd:document.getElementById('fd'),fs:document.getElementById('fs'),fb:document.getElementById('fb'),retry:document.getElementById('retry'),cm:document.getElementById('cm'),cl:document.getElementById('cl'),
  hud:document.getElementById('hud'),speed:document.getElementById('speed'),score:document.getElementById('score'),status:document.getElementById('status'),controls:document.getElementById('controls'),steerControls:document.getElementById('steerControls'),pedalControls:document.getElementById('pedalControls')
};
let W,H,roadX,roadW,run=false,last=0,t=0,dist=0,score=0,spawn=0,traffic=[],player,cash=+localStorage.getItem('cash')||10000,diff=localStorage.getItem('diff')||'Easy',mode=localStorage.getItem('mode')||'buttons',musicVol=+(localStorage.getItem('music')||70),sfxVol=+(localStorage.getItem('sfx')||70),song=+(localStorage.getItem('song')||1);
const D=['Easy','Medium','Hard','Extreme'],cfg={Easy:[55,1.25],Medium:[68,1],Hard:[82,.78],Extreme:[98,.6]},upgradeItems=[['Twin Turbo',5400],['Supercharger',3600],['Large Turbo',4700],['Sport Brakes',1300],['Race Brakes',2100],['Race Spoiler',1100],['Front Bumper',1200],['Rear Bumper',1200],['Grip Tires',1500]],owned=JSON.parse(localStorage.getItem('owned')||'[]'),keys={left:0,right:0,gas:0,brake:0};
function resize(){W=innerWidth;H=innerHeight;C.width=W*devicePixelRatio;C.height=H*devicePixelRatio;X.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);roadW=Math.min(W*.72,520);roadX=(W-roadW)/2}addEventListener('resize',resize);resize();
function panels(id){['menu','upgrades','leader','settings','crash'].forEach(k=>els[k].classList.toggle('hide',k!==id));}
function dc(el,v){el.textContent=v.toUpperCase();el.className='diff '+v.toLowerCase()}
function cyc(v){return D[(D.indexOf(v)+1)%4]}
function cashUI(){els.cash.textContent='$'+cash.toLocaleString()}
function upgradesUI(){els.ul.innerHTML='';upgradeItems.forEach((u,i)=>{let d=document.createElement('div');d.className='card';d.innerHTML='<b>'+u[0]+'</b><span class="price">'+(owned.includes(i)?'OWNED':'$'+u[1].toLocaleString())+'</span>';if(!owned.includes(i))d.onclick=()=>{if(cash>=u[1]){cash-=u[1];owned.push(i);localStorage.setItem('cash',cash);localStorage.setItem('owned',JSON.stringify(owned));cashUI();upgradesUI()}};els.ul.appendChild(d)})}
function modeBtn(){els.mode.textContent=mode.toUpperCase()}
function controlLayout(){
  const gyro=mode==='gyro';
  els.steerControls.style.display=gyro?'none':'block';
  els.pedalControls.style.display='flex';
  els.pedalControls.style.gap='10px';
  if(gyro){
    els.controls.style.justifyContent='space-between';
    els.pedalControls.style.width='100%';
    els.pedalControls.style.justifyContent='space-between';
  }else{
    els.controls.style.justifyContent='space-between';
    els.pedalControls.style.width='auto';
    els.pedalControls.style.justifyContent='flex-start';
  }
}
function songBtn(){els.song.textContent='TRACK '+song}
function settingsUI(){modeBtn();controlLayout();els.music.value=musicVol;els.sfx.value=sfxVol;songBtn()}
function saveSettings(){localStorage.setItem('mode',mode);localStorage.setItem('music',musicVol);localStorage.setItem('sfx',sfxVol);localStorage.setItem('song',song)}
function scores(){let a=JSON.parse(localStorage.getItem('scores_'+diff)||'[]');els.scores.innerHTML=a.length?a.map((x,i)=>'<div class="card">#'+(i+1)+' — '+x.s.toLocaleString()+' pts<br><small>'+x.t.toFixed(1)+'s • '+Math.round(x.d)+'m</small></div>').join(''):'<p>No runs yet.</p>'}
function start(){panels(null);els.hud.classList.remove('hide');controlLayout();t=dist=score=spawn=0;traffic=[];player={x:W/2,y:H*.68,w:30,h:52,s:0};run=true;last=performance.now();requestAnimationFrame(loop)}
function bind(id,k){let b=document.getElementById(id);b.onpointerdown=e=>{e.preventDefault();keys[k]=1};b.onpointerup=b.onpointercancel=b.onpointerleave=e=>{e.preventDefault();keys[k]=0}}['left','right','gas','brake'].forEach(k=>bind(k,k));
addEventListener('keydown',e=>{if(e.key==='ArrowLeft')keys.left=1;if(e.key==='ArrowRight')keys.right=1;if(e.key==='ArrowUp')keys.gas=1;if(e.key==='ArrowDown')keys.brake=1});
addEventListener('keyup',e=>{if(e.key==='ArrowLeft')keys.left=0;if(e.key==='ArrowRight')keys.right=0;if(e.key==='ArrowUp')keys.gas=0;if(e.key==='ArrowDown')keys.brake=0});
let tilt=0,gyroPermission='unknown';
function clamp(v){return Math.max(-1,Math.min(1,v))}
function handleOrientation(e){
  const angle=(screen.orientation&&typeof screen.orientation.angle==='number')?screen.orientation.angle:(typeof window.orientation==='number'?window.orientation:0);
  let steer=0;
  if(Math.abs(angle)===90 && e.beta!=null){
    steer=(angle===90?-e.beta:e.beta)/28;
  }else if(e.gamma!=null){
    steer=e.gamma/28;
  }
  tilt=clamp(steer);
}
addEventListener('deviceorientation',handleOrientation);
async function requestGyroPermission(){
  try{
    if(typeof DeviceOrientationEvent==='undefined'){
      alert('Gyro steering is not supported in this browser.');
      return false;
    }
    if(typeof DeviceOrientationEvent.requestPermission==='function'){
      const result=await DeviceOrientationEvent.requestPermission();
      gyroPermission=result;
      if(result!=='granted'){
        alert('Motion access was not allowed. In Safari, allow Motion & Orientation access, then try Gyro again.');
        return false;
      }
    }else{
      gyroPermission='granted';
    }
    return true;
  }catch(err){
    alert('Could not enable gyro steering. Make sure Motion & Orientation access is allowed for Safari.');
    return false;
  }
}
function loop(now){if(!run)return;let dt=Math.min(.035,(now-last)/1000);last=now;update(dt);draw();requestAnimationFrame(loop)}
function update(dt){let target=keys.gas?105:55;if(keys.brake)target=0;player.s+=(target-player.s)*dt*2.2;player.x+=(mode==='gyro'?tilt:(keys.right-keys.left))*260*dt;player.x=Math.max(roadX+25,Math.min(roadX+roadW-25,player.x));let active=player.s>=30;els.status.textContent=active?'':'TIMER PAUSED — SPEED TOO LOW';if(active){t+=dt;dist+=player.s*.44704*dt;score=Math.floor(t*10+dist);spawn-=dt;if(spawn<=0){let lane=Math.floor(Math.random()*3);traffic.push({x:roadX+roadW*(lane+.5)/3,y:-70,w:29,h:50,s:cfg[diff][0]*(.7+Math.random()*.5)});spawn=cfg[diff][1]}}traffic.forEach(v=>v.y+=(v.s+player.s*.35)*dt*(player.s/60));traffic=traffic.filter(v=>v.y<H+80);if(active)for(let v of traffic)if(Math.abs(player.x-v.x)<29&&Math.abs(player.y-v.y)<51)return crashGame();els.speed.textContent=Math.round(player.s)+' MPH';els.score.textContent=score.toLocaleString()}
function car(x,y,w,h,hero=false){X.save();X.translate(x,y);X.fillStyle=hero?'#d72e32':'#e8e8e8';X.fillRect(-w/2,-h/2,w,h);X.fillStyle='#111';X.fillRect(-w*.38,-h*.28,w*.76,h*.2);X.fillRect(-w*.38,h*.07,w*.76,h*.2);X.restore()}
function draw(){X.clearRect(0,0,W,H);X.fillStyle='#315d2e';X.fillRect(0,0,W,H);X.fillStyle='#555';X.fillRect(roadX,0,roadW,H);X.strokeStyle='#ddd';X.lineWidth=4;X.setLineDash([24,28]);for(let i=1;i<3;i++){X.beginPath();X.moveTo(roadX+roadW*i/3,0);X.lineTo(roadX+roadW*i/3,H);X.stroke()}X.setLineDash([]);traffic.forEach(v=>car(v.x,v.y,v.w,v.h));car(player.x,player.y,player.w,player.h,true)}
function crashGame(){run=false;let k='scores_'+diff,a=JSON.parse(localStorage.getItem(k)||'[]');a.push({s:score,t,d:dist});a.sort((a,b)=>b.s-a.s);a=a.slice(0,10);localStorage.setItem(k,JSON.stringify(a));els.ft.textContent=t.toFixed(1)+'s';els.fd.textContent=Math.round(dist)+' m';els.fs.textContent=score.toLocaleString();els.fb.textContent=a[0].s.toLocaleString();els.hud.classList.add('hide');panels('crash')}
els.dif.onclick=()=>{diff=cyc(diff);localStorage.setItem('diff',diff);dc(els.dif,diff)};
els.ld.onclick=()=>{diff=cyc(diff);dc(els.ld,diff);scores()};
els.play.onclick=start;els.retry.onclick=start;els.up.onclick=()=>{upgradesUI();panels('upgrades')};els.ub.onclick=()=>controlLayout();panels('menu');els.lb.onclick=()=>{scores();panels('leader')};els.lbback.onclick=()=>panels('menu');els.set.onclick=()=>{settingsUI();panels('settings')};els.sb.onclick=()=>{saveSettings();panels('menu')};els.cm.onclick=()=>panels('menu');els.cl.onclick=()=>{scores();panels('leader')};
els.mode.onclick=async()=>{
  if(mode==='buttons'){
    const ok=await requestGyroPermission();
    if(!ok)return;
    mode='gyro';
  }else{
    mode='buttons';
    tilt=0;
  }
  modeBtn();
  controlLayout();
  saveSettings();
};els.song.onclick=()=>{song=song%3+1;songBtn()};els.music.oninput=()=>musicVol=+els.music.value;els.sfx.oninput=()=>sfxVol=+els.sfx.value;
dc(els.dif,diff);dc(els.ld,diff);cashUI();panels('menu');
</script></body></html>
